apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dev-ns

bases:
  - ../../base

# Modify metadata names globally or apply specific overrides
namePrefix: dev-

replicas:
  - name: raj-dev-nginx
    count: 3

patchesStrategicMerge:
  - patch-config.yaml
  - patch-resources.yaml