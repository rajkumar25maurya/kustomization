apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: stage-ns

bases:
  - ../../base

# Modify metadata names globally or apply specific overrides
namePrefix: stage-

replicas:
  - name: raj-stage-nginx
    count: 3

patchesStrategicMerge:
  - patch-config.yaml
  - patch-resources.yaml